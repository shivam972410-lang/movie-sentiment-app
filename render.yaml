services:
  - type: web
    name: movie-sentiment-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CONFIDENCE_THRESHOLD
        value: 0.60
      - key: OMDB_API_KEY
        sync: false
      # Secret used to sign login tokens: Render generates a random value for you.
      - key: JWT_SECRET_KEY
        generateValue: true
      # PostgreSQL connection string for user accounts (set it in the Render dashboard).
      # Required for accounts to survive restarts: the free-tier disk is ephemeral.
      - key: DATABASE_URL
        sync: false
