services:
  - type: web
    name: movie-sentiment-api
    env: python
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CONFIDENCE_THRESHOLD
        value: 0.60
      - key: OMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
